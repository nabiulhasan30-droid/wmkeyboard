name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (leave empty to use gradle.properties version)'
        required: false
        default: ''
        type: string
      release_title:
        description: 'Release Title (optional)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  WMKB_ENABLE_PLAY_STORE: "false"
  WMKB_ENABLE_GMS: "false"
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Version & Tag
        id: ver
        run: |
          VERSION_NAME=$(grep '^wmkb.versionName=' gradle.properties | cut -d= -f2)
          VERSION_CODE=$(grep '^wmkb.versionCode=' gradle.properties | cut -d= -f2)
          
          INPUT_TAG="${{ github.event.inputs.release_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${{ github.ref_type }}" = 'tag' ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION_NAME}"
          fi
          
          TITLE="${{ github.event.inputs.release_title }}"
          if [ -z "$TITLE" ]; then
            TITLE="WMKeyboard / Nabiul Keyboard ${TAG}"
          fi
          
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building for Tag: $TAG (Version: $VERSION_NAME, Code: $VERSION_CODE)"

      - name: Set up Permanent Keystore
        run: |
          mkdir -p keystore
          KEYSTORE_PATH="keystore/release.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Using existing permanent keystore..."
          elif [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Restoring keystore from secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          else
            echo "Creating permanent fixed release keystore for repository..."
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" \
              -alias nabiul_release_key -keyalg RSA -keysize 2048 -validity 20000 \
              -storepass nabiul_app_key_2026 -keypass nabiul_app_key_2026 \
              -dname "CN=Nabiul Keyboard, OU=Nabiul, O=Nabiul, L=Kolkata, ST=WB, C=IN"
            
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add keystore/release.keystore
            git commit -m "chore: persist permanent release keystore for seamless updates [skip ci]" || true
            git push origin HEAD:main || true
          fi
          
          echo "RELEASE_STORE_FILE=keystore/release.keystore" >> $GITHUB_ENV
          echo "RELEASE_STORE_PASSWORD=nabiul_app_key_2026" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=nabiul_release_key" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=nabiul_app_key_2026" >> $GITHUB_ENV

      - name: Build Release APK
        env:
          RELEASE_STORE_FILE: keystore/release.keystore
          RELEASE_STORE_PASSWORD: nabiul_app_key_2026
          RELEASE_KEY_ALIAS: nabiul_release_key
          RELEASE_KEY_PASSWORD: nabiul_app_key_2026
        run: |
          chmod +x gradlew
          ./gradlew assembleIntlRelease -Pwmkb.skipBenchmarks=true --stacktrace

      - name: Sign & Prepare APK for Release
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -n 1)
          APKSIGNER="${BUILD_TOOLS_DIR}apksigner"
          
          FOUND_APK=$(find app/build/outputs/apk/intl/release/ -name "*.apk" | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            echo "::error::No APK found in app/build/outputs/apk/intl/release/"
            exit 1
          fi
          
          TAG="${{ steps.ver.outputs.tag }}"
          OUTPUT_APK="wmkeyboard-${TAG}-release.apk"
          
          if ! $APKSIGNER verify "$FOUND_APK" 2>/dev/null; then
            echo "Signing APK with apksigner..."
            $APKSIGNER sign \
              --ks keystore/release.keystore \
              --ks-key-alias nabiul_release_key \
              --ks-pass pass:nabiul_app_key_2026 \
              --key-pass pass:nabiul_app_key_2026 \
              --out "$OUTPUT_APK" \
              "$FOUND_APK"
          else
            echo "APK already signed by Gradle, copying to $OUTPUT_APK..."
            cp "$FOUND_APK" "$OUTPUT_APK"
          fi
          
          echo "Verifying final APK signature..."
          $APKSIGNER verify --verbose --print-certs "$OUTPUT_APK"
          ls -lh "$OUTPUT_APK"

      - name: Generate Changelog Notes
        id: notes
        run: |
          cat << 'EOF' > release_notes.md
          ### 🚀 Release Highlights
          - **Custom Clipboard Names / Labels**: প্রতিটি ক্লিপবোর্ড আইটেমে এখন নিজস্ব নাম/লেবেল সেট করা যায়।
          - **Smart Search**: ক্লিপবোর্ডে দেওয়া নাম দিয়ে সরাসরি যেকোনো ক্লিপ সার্চ করে বের করা যায়।
          - **Privacy-First & Offline**: সম্পূর্ণ অফলাইন ও আধুনিক বাংলা ও বহুভাষিক কিবোর্ড।
          - **Seamless Updates**: পার্মানেন্ট রিলিজ কি-স্টোর দিয়ে সাইন করা, যাতে আগের ভার্সনের ওপর সরাসরি আপডেট ইন্সটল করা যায়।
          EOF

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.title }}
          body_path: release_notes.md
          files: wmkeyboard-*.apk
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
